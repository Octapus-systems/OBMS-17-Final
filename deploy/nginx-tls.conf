# HTTP and HTTPS side by side.
#
# Port 80 keeps working (no forced redirect) so existing bookmarks do not break
# mid-session. HTTPS is what unlocks the secure-context APIs Chrome gates:
# navigator.mediaDevices (Discuss calls), Notification (desktop alerts) and
# navigator.clipboard (the "copy error" button in Odoo's error dialog).
#
# Swap DOMAIN below when a real domain replaces the sslip.io hostname.

upstream obms {
    server odoo:8069;
}

# Multiprocess Odoo serves websockets from the gevent port, not 8069.
upstream obms_chat {
    server odoo:8072;
}

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 200m;
    proxy_read_timeout   720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout   720s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /websocket {
        proxy_pass http://obms_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /longpolling { proxy_pass http://obms_chat; }

    location / {
        proxy_pass http://obms;
        proxy_redirect off;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name 3-111-245-98.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/3-111-245-98.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3-111-245-98.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_prefer_server_ciphers off;

    client_max_body_size 200m;
    proxy_read_timeout   720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout   720s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /websocket {
        proxy_pass http://obms_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /longpolling { proxy_pass http://obms_chat; }

    location / {
        proxy_pass http://obms;
        proxy_redirect off;
    }

    location ~* /web/assets/ {
        proxy_pass http://obms;
        expires 30d;
        add_header Cache-Control public;
    }

    gzip on;
    gzip_types text/css text/plain text/xml application/xml application/json
               application/javascript application/x-javascript
               text/javascript image/svg+xml;
}
