# coturn - TURN relay for Discuss calls.
#
# STUN alone only reports each peer its public address. When either side sits
# behind symmetric NAT (common on office and mobile networks) the direct path
# never opens, signalling churns, and the call drops with a warning triangle.
# TURN relays the media instead, which always works at the cost of bandwidth.

listening-port=3478
# PUBLIC/PRIVATE. EC2 gives the instance only its private address on the NIC,
# so coturn must be told the 1:1 NAT mapping or it advertises candidates that
# no external peer can reach.
external-ip=3.111.245.98/172.31.45.144
realm=3-111-245-98.sslip.io

# Long-term credentials; must match the mail.ice.server record in Odoo.
lt-cred-mech
user=obms:TURN_PASSWORD_PLACEHOLDER

# Relay port range. Kept small so the AWS security group rule stays narrow -
# each concurrent call leg consumes one port.
min-port=49160
max-port=49200

fingerprint
no-cli
no-tlsv1
no-tlsv1_1

# Deny only what this server can actually reach and must never expose:
# its own VPC, the EC2 instance-metadata endpoint (169.254.169.254 - the
# classic SSRF target), loopback and 0.0.0.0/8.
#
# Client LAN ranges (10/8, 192.168/16 and the rest of 172.16/12) are NOT
# denied. Browsers advertise their local addresses as ICE candidates, so
# blocking them makes coturn answer CREATE_PERMISSION with 403 and the
# candidate pair fails - which is what broke calling here. Those addresses
# are unroutable from this host anyway, so permitting them relays nothing.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.31.0.0-172.31.255.255

# ...but permit this host's own address. When BOTH callers use the relay, each
# one's remote candidate is the relay's public IP, which coturn maps back to
# this private address - so the VPC deny rule above would reject the
# relay-to-relay path and the call never connects. allowed-peer-ip wins over
# denied-peer-ip, so the rest of the VPC stays blocked.
allowed-peer-ip=172.31.45.144

log-file=stdout
verbose
