# HTTP-only front end, used until a domain name exists for Let's Encrypt.
#
# WARNING: without TLS, Chrome treats the origin as insecure, so getUserMedia
# and the Notification API are blocked for every client except one browsing
# from the server itself. Discuss calls and desktop notifications will NOT
# work until nginx.conf (TLS) replaces this file.
upstream obms {
    server odoo:8069;
}

# Multiprocess Odoo serves websockets from the gevent port, not 8069.
upstream obms_chat {
    server odoo:8072;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 200m;
    proxy_read_timeout   720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout   720s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Pass Cloudflare's X-Forwarded-Proto through unchanged.
    # Cloudflare sets this to "https" when the client connects via HTTPS,
    # even though Cloudflare talks plain HTTP to our origin (flexible SSL).
    # Overwriting it with $scheme (= "http") would cause Odoo to believe the
    # request is HTTP, set web.base.url = http://..., and generate HTTP URLs
    # that the browser blocks as mixed content → white screen.
    # For direct HTTP access (no Cloudflare), this header is absent and
    # Odoo correctly falls back to treating the request as HTTP.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /websocket {
        proxy_pass http://obms_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /longpolling {
        proxy_pass http://obms_chat;
    }

    location / {
        proxy_pass http://obms;
        proxy_redirect off;
    }

    location ~* /web/assets/ {
        proxy_pass http://obms;
        expires 30d;
        add_header Cache-Control public;
    }

    gzip on;
    gzip_types text/css text/plain text/xml application/xml application/json
               application/javascript application/x-javascript
               text/javascript image/svg+xml;
}
