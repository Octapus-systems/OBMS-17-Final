[options]
db_host = db
db_port = 5432
db_user = odoo
; db_password comes from the PASSWORD env var set in docker-compose.yml
db_name = obms_17

addons_path = /opt/odoo/addons,/opt/odoo/custom
data_dir = /var/lib/odoo

; CHANGE THIS before first boot.
admin_passwd = CHANGE_ME_STRONG

http_port = 8069
http_interface = 0.0.0.0

; Behind nginx: trust X-Forwarded-* so Odoo builds correct absolute URLs and
; marks sessions secure. Required for the websocket + HTTPS to agree.
proxy_mode = True

without_demo = True
list_db = False

; Linux can fork, unlike the Windows dev box, so use real workers.
; Rule of thumb: (2 * vCPU) + 1. t3.small = 2 vCPU -> 5.
; gevent_port carries the websocket/longpolling traffic in multiprocess mode.
workers = 5
gevent_port = 8072

limit_time_cpu = 300
limit_time_real = 600
limit_memory_soft = 671088640
limit_memory_hard = 805306368
max_cron_threads = 2
