upstream obms {
    server odoo:8069;
}

# In multiprocess mode (workers > 0) Odoo handles websockets in a separate
# gevent process on gevent_port. Sending /websocket to 8069 instead is the
# classic cause of "realtime notifications don't work in production".
upstream obms_chat {
    server odoo:8072;
}

# ACME challenge + redirect everything else to HTTPS.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Odoo serves large assets and accepts file uploads.
    client_max_body_size 200m;
    proxy_read_timeout   720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout   720s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The bus: /websocket must carry the Upgrade handshake through, otherwise
    # Discuss falls back to nothing and realtime notifications die.
    location /websocket {
        proxy_pass http://obms_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /longpolling {
        proxy_pass http://obms_chat;
    }

    location / {
        proxy_pass http://obms;
        proxy_redirect off;
    }

    # Long-lived, content-hashed asset bundles.
    location ~* /web/assets/ {
        proxy_pass http://obms;
        proxy_cache_valid 200 60m;
        expires 30d;
        add_header Cache-Control public;
    }

    gzip on;
    gzip_types text/css text/plain text/xml application/xml application/json
               application/javascript application/x-javascript
               text/javascript image/svg+xml;
}
