name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - AjayDev
      - jishad-dev

jobs:
  validate:
    name: Validate OBMS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libldap2-dev \
            libsasl2-dev \
            libpq-dev \
            libxml2-dev \
            libxslt1-dev \
            libjpeg-dev \
            zlib1g-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-custom.txt
          pip install flake8 pip-audit

      - name: Python syntax check
        run: |
          python -m compileall -q custom

      - name: Lint custom modules
        run: |
          flake8 custom \
            --exclude="__pycache__" \
            --max-line-length=120

      - name: Security audit
        run: |
          pip-audit \
            -r requirements.txt \
            -r requirements-custom.txt

      - name: Validate Docker build
        run: |
          docker build \
            -f deploy/Dockerfile \
            -t obms-ci:${{ github.sha }} \
            .