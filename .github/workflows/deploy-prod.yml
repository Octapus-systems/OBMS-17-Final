name: Deploy to AWS Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Package source code
      run: |
        tar -czf /tmp/obms.tar.gz \
          --exclude=.git \
          --exclude=.github \
          --exclude=venv \
          --exclude=.venv \
          --exclude=node_modules \
          --exclude=filestore \
          --exclude=sessions \
          --exclude=__pycache__ \
          --exclude="*.pyc" \
          --exclude="*.log" \
          --exclude=Source \
          .
        cp /tmp/obms.tar.gz ./obms.tar.gz
          
    - name: Copy tarball to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "obms.tar.gz"
        target: "/opt/obms"
        
    - name: Execute deployment script on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -eux
          cd /opt/obms
          
          echo ">>> Extracting source..."
          rm -rf src.new
          mkdir -p src.new
          tar -xzf obms.tar.gz -C src.new
          rm -f obms.tar.gz
          
          # Swap atomically
          if [ -d src ]; then
              mv src src.old
          fi
          mv src.new src
          
          # Wire credentials from deploy.env
          if [ -f deploy.env ]; then
              cp deploy.env src/deploy/.env
              DB_PASSWORD=$(grep '^DB_PASSWORD=' deploy.env | cut -d= -f2)
              ADMIN_PASSWD=$(grep '^ADMIN_PASSWD=' deploy.env | cut -d= -f2)
              sed -i "s|^db_password = .*|db_password = ${DB_PASSWORD}|" src/deploy/odoo.conf
              sed -i "s|^admin_passwd = .*|admin_passwd = ${ADMIN_PASSWD}|" src/deploy/odoo.conf
          else
              echo 'WARNING: deploy.env not found - keeping placeholder credentials in odoo.conf'
          fi
          
          cd src/deploy
          
          # Rebuild only the odoo image
          echo ">>> Building Odoo image..."
          docker compose build odoo 2>&1 | tail -30
          
          # Start Odoo
          echo ">>> Starting Odoo..."
          docker compose up -d --force-recreate --no-deps odoo

          # ── TLS bootstrap ──────────────────────────────────────────────────
          # nginx.conf (TLS) requires the cert to exist before nginx will start.
          # On the very first deploy the cert is absent, causing the restart loop.
          # Solution: boot nginx with the HTTP-only config first, run certbot once
          # to obtain the cert, then switch to the TLS config and reload.
          # On all future deploys the cert already exists so we skip straight to
          # the TLS start (the --keep-until-expiring flag makes certbot a no-op).
          CERT="/etc/letsencrypt/live/obms.octopus.ae/fullchain.pem"

          if [ ! -f "$CERT" ]; then
            echo ">>> Certificate absent – bootstrapping ACME..."
            # Save the TLS config and temporarily replace with HTTP-only
            cp nginx.conf nginx.conf.tls
            cp nginx-http.conf nginx.conf
            docker compose up -d --force-recreate --no-deps nginx
            sleep 5  # give nginx a moment to bind port 80

            # Obtain the certificate (one-shot container, shares certbot volumes)
            docker compose run --rm certbot certonly \
              --webroot -w /var/www/certbot \
              --domain obms.octopus.ae \
              --email admin@octopus.ae \
              --agree-tos --non-interactive

            # Restore TLS config and do a hot reload (no port flap)
            mv nginx.conf.tls nginx.conf
            docker compose exec nginx nginx -s reload
            echo ">>> Certificate obtained – nginx now serving HTTPS"
          else
            echo ">>> Certificate present – starting nginx with TLS config..."
            docker compose up -d --force-recreate --no-deps nginx
            # Keep cert fresh; certbot skips renewal when >30 days remain
            docker compose run --rm certbot renew \
              --webroot -w /var/www/certbot --quiet || true
          fi
          # ───────────────────────────────────────────────────────────────────

          # Cleanup old source
          rm -rf /opt/obms/src.old

          echo ">>> Waiting for health..."
          sleep 10
          docker compose ps
          echo ">>> Done!"
