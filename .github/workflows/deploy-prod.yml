name: Deploy to AWS Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Package source code
      run: |
        tar -czf /tmp/obms.tar.gz \
          --exclude=.git \
          --exclude=.github \
          --exclude=venv \
          --exclude=.venv \
          --exclude=node_modules \
          --exclude=filestore \
          --exclude=sessions \
          --exclude=__pycache__ \
          --exclude="*.pyc" \
          --exclude="*.log" \
          --exclude=Source \
          .
        cp /tmp/obms.tar.gz ./obms.tar.gz
          
    - name: Copy tarball to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "obms.tar.gz"
        target: "/opt/obms"
        
    - name: Execute deployment script on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -eux
          cd /opt/obms
          
          echo ">>> Extracting source..."
          rm -rf src.new
          mkdir -p src.new
          tar -xzf obms.tar.gz -C src.new
          rm -f obms.tar.gz
          
          # Swap atomically.
          # Always remove src.old first – if a previous deploy failed mid-way,
          # src.old may still exist. Without this, `mv src src.old` tries to
          # move src *inside* the existing src.old directory, then fails with
          # "cannot overwrite src.old/src: Directory not empty".
          rm -rf src.old
          if [ -d src ]; then
              mv src src.old
          fi
          mv src.new src
          
          # Wire credentials from deploy.env
          if [ -f deploy.env ]; then
              cp deploy.env src/deploy/.env
              DB_PASSWORD=$(grep '^DB_PASSWORD=' deploy.env | cut -d= -f2)
              ADMIN_PASSWD=$(grep '^ADMIN_PASSWD=' deploy.env | cut -d= -f2)
              sed -i "s|^db_password = .*|db_password = ${DB_PASSWORD}|" src/deploy/odoo.conf
              sed -i "s|^admin_passwd = .*|admin_passwd = ${ADMIN_PASSWD}|" src/deploy/odoo.conf
          else
              echo 'WARNING: deploy.env not found - keeping placeholder credentials in odoo.conf'
          fi
          
          cd src/deploy
          
          # Rebuild only the odoo image
          echo ">>> Building Odoo image..."
          docker compose build odoo 2>&1 | tail -30
          
          # Start Odoo
          echo ">>> Starting Odoo..."
          docker compose up -d --force-recreate --no-deps odoo

          # ── TLS bootstrap ──────────────────────────────────────────────────
          # The certbot service has a custom entrypoint (an infinite renew loop).
          # All one-shot certbot calls MUST use --entrypoint certbot to bypass
          # that loop; without it docker compose run inherits the entrypoint,
          # ignores our subcommand, and runs forever → GHA times out.
          #
          # Cert lives in the certbot-conf Docker volume, NOT on the host FS.
          # Check existence inside the volume via --entrypoint sh.

          if docker compose run --rm --no-deps --entrypoint sh certbot \
               -c "test -f /etc/letsencrypt/live/obms.octapus.ae/fullchain.pem" \
               2>/dev/null; then
            # ── cert already present: normal start + opportunistic renewal ──
            echo ">>> Certificate present – starting nginx with TLS config..."
            docker compose up -d --force-recreate --no-deps nginx
            # Renew only if expiry is within 30 days; certbot exits 0 either way.
            docker compose run --rm --no-deps --entrypoint certbot certbot \
              renew --webroot -w /var/www/certbot --quiet || true
          else
            # ── first deploy: obtain cert via HTTP ACME challenge ────────────
            echo ">>> Certificate absent – bootstrapping ACME..."
            # Start nginx in HTTP-only mode so port 80 serves the ACME challenge.
            cp nginx.conf nginx.conf.tls
            cp nginx-http.conf nginx.conf
            docker compose up -d --force-recreate --no-deps nginx
            sleep 5   # let nginx bind port 80

            # Issue the certificate. timeout 90 ensures GHA fails fast if
            # Let's Encrypt cannot reach port 80 (e.g., Cloudflare proxy blocking).
            timeout 90 docker compose run --rm --no-deps --entrypoint certbot certbot \
              certonly \
              --webroot -w /var/www/certbot \
              --domain obms.octapus.ae \
              --email admin@octapus.ae \
              --agree-tos --non-interactive

            # Restore TLS config and hot-reload nginx (no port flap).
            mv nginx.conf.tls nginx.conf
            docker compose exec nginx nginx -s reload
            echo ">>> Certificate obtained – nginx now serving HTTPS"
          fi
          # ───────────────────────────────────────────────────────────────────

          # Cleanup old source
          rm -rf /opt/obms/src.old

          echo ">>> Waiting for health..."
          sleep 10
          docker compose ps
          echo ">>> Done!"
